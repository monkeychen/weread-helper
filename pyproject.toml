[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weread-scrapy"
version = "0.1.0"
description = "Export books from WeRead (微信读书) as PDF, EPUB, or Markdown"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "playwright>=1.43",
    "PyPDF2>=3.0",
    "ebooklib>=0.18",
    "pdfplumber>=0.10",
]

[project.scripts]
weread = "weread.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
